[package]
name = "better16-bootstrapper"
version = "1.1.0"
edition = "2024"
description = "Installs, updates and launches the Better16 player and Better16 Studio. Runs on everything from Windows XP up."
license = "MIT"
repository = "https://github.com/Bazir55/better16-bootstrapper"
publish = false

[[bin]]
name = "Better16Launcher"
path = "src/main.rs"
test = false

[[bin]]
name = "Better16StudioLauncher"
path = "src/main_studio.rs"
test = false

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
